<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; connect-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#06101d">
<title>Sensor Display</title>
<style>
/* ---------- Skins ---------- */
:root, [data-style="institutional"]{
  --bg:#06101d; --bg2:#0a1829; --panel:#0c1c31; --panel-hi:#10243e;
  --line:#2c4a6e; --line-hi:#7fa3cc; --text:#eef3f9; --dim:#95a9bf;
  --accent:#c9a24a; --accent-soft:rgba(201,162,74,.16);
  --ok:#5fd39a; --warn:#e7a93a; --alert:#ef5350;
  --radius:10px; --corner:14px;
  --f-display:"Roboto Condensed","Arial Narrow","Liberation Sans Narrow","DejaVu Sans Condensed",sans-serif;
  --f-body:"Roboto","Noto Sans","DejaVu Sans",system-ui,sans-serif;
  --f-data:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  --label-case:none; --label-track:.04em; --name-track:.14em;
  --atmo:.43,.7,1.0;
  --boot-glow:#0c1d33;
}
[data-style="military"]{
  --bg:#020503; --bg2:#040a05; --panel:#050b06; --panel-hi:#08140a;
  --line:#1f5a2a; --line-hi:#66e07a; --text:#d9ffdc; --dim:#79a57f;
  --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
  --ok:#66e07a; --warn:#ffb000; --alert:#ff4b3e;
  --radius:0px; --corner:0px;
  --f-display:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  --f-body:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  --f-data:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  --label-case:uppercase; --label-track:.1em; --name-track:.06em;
  --boot-glow:#0a1a0d;
}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100%}
button{font:inherit;color:inherit}

/* ---------- Top bar ---------- */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:linear-gradient(var(--bg2),rgba(6,16,29,.92));
  border-bottom:1px solid var(--line)}
[data-style="military"] .bar{background:var(--bg2)}
.net{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.net-mark{width:26px;height:26px;flex:none;border:2px solid var(--accent);border-radius:50%;
  display:grid;place-items:center}
.net-mark::after{content:"";width:8px;height:8px;background:var(--accent);border-radius:50%}
[data-style="military"] .net-mark,[data-style="military"] .net-mark::after{border-radius:0}
.net-name{font-family:var(--f-display);font-size:17px;letter-spacing:var(--label-track);
  text-transform:var(--label-case);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-data);color:var(--dim);font-size:15px}
.tb{min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius);cursor:pointer;font-size:15px;
  letter-spacing:var(--label-track);text-transform:var(--label-case)}
.tb:active{background:var(--panel-hi)}
.tb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tb:focus-visible,.panel:focus-visible,.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- World switcher ---------- */
.worlds{display:flex;gap:8px;padding:10px 14px 0;overflow-x:auto}
.worlds[hidden]{display:none}

/* ---------- Dossier layout ---------- */
.dossier{max-width:1500px;margin:0 auto;padding:14px;display:grid;gap:12px;
  grid-template-columns:1fr 1fr;
  grid-template-areas:"head head" "globe globe" "data thermal" "strip strip" "feed feed" "details details"}
.d-globe{height:clamp(360px,72vw,760px)}
@media (max-width:700px){
  .dossier{grid-template-columns:1fr;
    grid-template-areas:"head" "globe" "data" "thermal" "strip" "feed" "details"}
}
@media (max-width:700px){.d-globe{height:clamp(320px,92vw,560px)}}
@media (orientation:landscape) and (min-width:1000px){
  .d-globe{height:auto}
  .d-thermal .frame{aspect-ratio:auto;height:clamp(160px,22vw,260px)}
  .dossier .d-strip{grid-template-columns:repeat(2,1fr)}
  .dossier .qs:nth-child(3){border-left:0}
  .dossier .qs:nth-child(n+3){border-top:1px solid var(--line)}
  .dossier{grid-template-columns:1.05fr 1fr;
    grid-template-areas:"head head" "globe strip" "globe feed" "data thermal" "details details"}
}
.d-head{grid-area:head} .d-globe{grid-area:globe} .d-data{grid-area:data}
.d-thermal{grid-area:thermal} .d-strip{grid-area:strip} .d-feed{grid-area:feed}
.d-details{grid-area:details}

/* ---------- Header ---------- */
.d-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:6px 4px 10px;border-bottom:2px solid var(--line)}
.p-name{margin:0;font-family:var(--f-display);font-weight:700;line-height:.9;
  font-size:clamp(46px,9vw,104px);letter-spacing:var(--name-track);text-transform:uppercase}
.p-type{margin-top:8px;font-family:var(--f-display);font-size:clamp(17px,2.4vw,24px);
  color:var(--accent);letter-spacing:.22em;text-transform:uppercase}
.p-tag{max-width:24ch;text-align:right;color:var(--dim);font-size:clamp(16px,2vw,20px);line-height:1.3}
.p-depth{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid var(--line-hi);
  border-radius:999px;font-family:var(--f-data);font-size:13px;color:var(--line-hi);
  letter-spacing:.08em;text-transform:uppercase}
[data-style="military"] .p-depth{border-radius:0}

/* ---------- Panels ---------- */
.panel{position:relative;background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.panel.tap{cursor:pointer}
.panel.tap:active{border-color:var(--line-hi)}
.panel::before{content:"";position:absolute;top:-1px;left:-1px;width:var(--corner);height:var(--corner);
  border-top:2px solid var(--accent);border-left:2px solid var(--accent);border-top-left-radius:var(--radius)}
[data-style="military"] .panel::before{width:10px;height:10px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-family:var(--f-display);
  font-size:17px;font-weight:600;color:var(--line-hi);letter-spacing:var(--label-track);
  text-transform:var(--label-case)}
.ph svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ph .more{margin-left:auto;font-family:var(--f-data);font-size:12px;color:var(--dim);font-weight:400}
.pt{margin:0;font-size:17px;line-height:1.5}
.lead{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--text);margin-bottom:2px}
.cap{margin:10px 0 0;font-size:15.5px;line-height:1.45;color:var(--dim)}

/* ---------- Globe ---------- */
.d-globe{padding:0;overflow:hidden;min-height:340px;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 40% 45%,#0b1b30 0%,#03070d 70%)}
[data-style="military"] .d-globe{background:#000}
.globe-wrap{position:relative;flex:1;min-height:300px;touch-action:none;cursor:grab}
.globe-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.globe-hud{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;
  font-family:var(--f-data);font-size:13px;color:var(--dim);pointer-events:none}
.globe-hint{position:absolute;top:12px;left:16px;font-family:var(--f-display);font-size:15px;
  color:var(--line-hi);letter-spacing:var(--label-track);text-transform:var(--label-case);pointer-events:none}
.globe-x{position:absolute;top:8px;right:8px}

/* ---------- Planetary data ---------- */
.dt{width:100%;border-collapse:collapse}
.dt th,.dt td{padding:6px 0;border-bottom:1px solid rgba(127,163,204,.16);text-align:left;vertical-align:top}
.dt th{font-weight:400;color:var(--dim);font-size:15px;width:52%;letter-spacing:var(--label-track);
  text-transform:var(--label-case)}
[data-style="military"] .dt th{font-size:13px}
.dt td{font-family:var(--f-data);font-size:16px}
.dt tr:last-child th,.dt tr:last-child td{border-bottom:0}

/* ---------- Images and signal ---------- */
.frame{position:relative;overflow:hidden;border-radius:calc(var(--radius) - 4px);background:#000;border:1px solid var(--line)}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
.frame canvas.noise{display:block;width:100%;height:100%}
.frame video,.feed video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.feed video{position:absolute;inset:0}
/* 3.6.4: drone videos always show the whole frame, and on phones the feed keeps 16:9 instead of stretching. */
.feed video{object-fit:contain}
.gm-media{display:grid;gap:6px;margin:0}
.gm-media div{padding:6px 10px;border:1px solid #445;border-radius:8px;background:#10161e;font-size:14px}
.gm-media b{display:block;font-size:15px}
.gm-media span{display:block;color:#9aa8b8;font-size:12.5px;overflow-wrap:anywhere}
.gm-media [data-mode="video"] b,.gm-media [data-mode="image"] b{color:#66e07a}
.gm-media [data-mode="static"] b{color:#ffb000}
.frame.sq{aspect-ratio:4/3}
.frame.wide{aspect-ratio:16/9}
.frame.banner{aspect-ratio:21/9}
.fx::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55))}
.signal{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.signal b{display:block;font-family:var(--f-display);font-size:clamp(17px,2.4vw,24px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--warn);text-shadow:0 0 12px rgba(0,0,0,.9)}
.signal span{display:block;margin-top:4px;font-family:var(--f-data);font-size:13px;color:var(--dim);
  text-shadow:0 0 8px #000}

/* ---------- Quick strip ---------- */
.d-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0}
@media (max-width:700px){.d-strip{grid-template-columns:repeat(2,1fr)}}
.qs{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.qs:first-child{border-left:0}
@media (max-width:700px){.qs:nth-child(3){border-left:0}.qs:nth-child(n+3){border-top:1px solid var(--line)}}
.qs small{display:block;color:var(--dim);font-size:14px;letter-spacing:var(--label-track);text-transform:var(--label-case)}
.qs strong{display:block;margin-top:3px;font-family:var(--f-display);font-size:clamp(18px,2.2vw,23px);font-weight:600}
.qs strong{overflow-wrap:break-word;hyphens:auto}
[data-style="military"] .qs strong{font-size:clamp(15px,1.8vw,20px)}
[data-style="military"] .qs{padding:12px 12px}

/* ---------- Drone feed ---------- */
.d-feed{padding:10px}
.d-drone{padding:10px;display:flex}
.d-drone .feed{flex:1;aspect-ratio:16/9;min-height:180px}
@media (max-width:700px){.d-drone .feed{flex:none;width:100%;min-height:0}}
.feed{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;border-radius:calc(var(--radius) - 4px)}
.feed img{position:absolute;left:-6%;top:-6%;width:112%;height:112%;object-fit:cover;
  animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-2.5%,1.2%) scale(1.03)}100%{transform:translate(2%,-1.5%) scale(1.05)}}
.feed .jit{position:absolute;inset:0;animation:jitter 6s steps(1) infinite}
@keyframes jitter{0%,96%,100%{transform:none}97%{transform:translate(2px,-1px)}98%{transform:translate(-3px,1px)}}
.feed canvas.noise{position:absolute;inset:0;width:100%;height:100%}
.feed .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.35}
.feed-ol{position:absolute;inset:0;pointer-events:none;font-family:var(--f-data);font-size:13px;color:#e8f2ff;
  text-shadow:0 0 6px #000}
.feed-ol .tl{position:absolute;top:10px;left:12px}
.feed-ol .tr{position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:6px}
.feed-ol .bl{position:absolute;bottom:10px;left:12px}
.live{width:10px;height:10px;border-radius:50%;background:var(--alert);animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.brk{position:absolute;width:26px;height:26px;border:2px solid rgba(232,242,255,.7)}
.brk.a{top:14px;left:14px;border-right:0;border-bottom:0;top:34px}
.brk.b{top:34px;right:14px;border-left:0;border-bottom:0}
.brk.c{bottom:34px;left:14px;border-right:0;border-top:0}
.brk.d{bottom:34px;right:14px;border-left:0;border-top:0}
.feed-bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.feed-bar .ph{margin:0 auto 0 4px}
.mode{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  border-radius:var(--radius);font-family:var(--f-data);font-size:14px;letter-spacing:.08em}
.mode[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.d-feed .cap{margin:8px 4px 2px}

/* ---------- Details ---------- */
.d-details{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.d-details{grid-template-columns:1fr}}
.d-details .full{grid-column:1/-1}
.dp{display:flex;flex-direction:column;gap:10px}
.dp .frame{max-height:220px}
.locked{border-style:dashed;cursor:default}
.locked .pt{color:var(--dim);font-family:var(--f-data);font-size:14px;letter-spacing:.06em}

/* ---------- Expanded view ---------- */
.ex{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px)}

.ex[hidden]{display:none}
.ex-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ex-title{flex:1;margin:0;font-family:var(--f-display);font-size:clamp(22px,3.4vw,34px);
  letter-spacing:var(--label-track);text-transform:var(--label-case);color:var(--line-hi)}
.ex-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:auto;
  max-width:1200px;width:100%;margin:0 auto}
.ex-media{flex:1;min-height:40vh;position:relative}
.ex-media .frame,.ex-media .feed,.ex-media .globe-wrap{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.ex-text{font-size:clamp(18px,2.2vw,22px);line-height:1.55;max-width:70ch}
.ex-text .lead{font-size:clamp(22px,2.8vw,28px)}

/* ---------- Glitch ---------- */
.glitch{animation:glitch .55s steps(1) 1}
@keyframes glitch{
  0%{transform:none;filter:none}
  15%{transform:translateX(-6px);filter:hue-rotate(70deg) saturate(2)}
  30%{transform:translateX(5px) skewX(3deg);clip-path:inset(18% 0 50% 0)}
  45%{transform:none;clip-path:inset(62% 0 8% 0);filter:contrast(2) brightness(1.4)}
  60%{clip-path:none;filter:hue-rotate(-50deg)}
  80%{transform:translateX(-2px);filter:brightness(1.6)}
  100%{transform:none;filter:none;clip-path:none}}

/* Motion switch is the authority. */
.no-motion *,.no-motion *::before,.no-motion *::after{animation:none !important;transition:none !important}


html,body{overscroll-behavior:none}
/* ---------- Alert state (attack trigger or Start: alert) ---------- */
[data-alert="on"]{
  --line:#6e211c; --line-hi:#ff7a6b; --accent:#ffb000; --accent-soft:rgba(255,176,0,.14);
  --panel:#0b0503; --panel-hi:#170806; --bg:#050201; --bg2:#0d0403; --text:#ffe9e4; --dim:#c08f86;
  --boot-glow:#1c0805;
}
[data-alert="on"] .net-name{color:var(--line-hi)}
.net{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.net-mark.armed::after{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
/* 3.6.1: the GM hold target stays, but the badge mark is invisible.  Hold the top-left corner 1.2 s, or Ctrl+Shift+G. */
.net-mark{opacity:0}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:61px;z-index:15;display:flex;gap:8px;max-width:1500px;margin:0 auto;padding:10px 14px 0}
.tab{flex:1;min-height:52px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  border-radius:var(--radius);font-family:var(--f-display);font-size:19px;letter-spacing:var(--label-track);
  text-transform:var(--label-case)}
.tab[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tab .count{margin-left:8px;font-family:var(--f-data);font-size:14px;color:var(--dim)}
.tab.flash{animation:tabflash 1s steps(1) infinite;border-color:var(--alert);color:#fff}
@keyframes tabflash{50%{background:var(--alert)}}
.view[hidden]{display:none}

/* ---------- Briefs ---------- */
.briefs{max-width:1100px;margin:0 auto;padding:14px;display:grid;gap:14px}
.brief{padding:18px 20px}
.brief.emergency{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert),0 0 28px rgba(239,83,80,.25)}
.b-type{display:inline-block;padding:3px 10px;border:1px solid var(--line-hi);border-radius:999px;
  font-family:var(--f-data);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--line-hi)}
[data-style="military"] .b-type{border-radius:0}
.brief.emergency .b-type{border-color:var(--alert);color:#fff;background:var(--alert)}
.b-title{margin:10px 0 6px;font-family:var(--f-display);font-size:clamp(26px,4vw,40px);line-height:1.05}
.b-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 4px;font-size:16px}
.b-meta dt{color:var(--dim);letter-spacing:var(--label-track);text-transform:var(--label-case);font-size:14px;padding-top:2px}
.b-meta dd{margin:0}
.b-sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.b-sec h4{margin:0 0 8px;font-family:var(--f-display);font-size:18px;color:var(--line-hi);
  letter-spacing:var(--label-track);text-transform:var(--label-case)}
.b-sec p{margin:0 0 8px;font-size:18px;line-height:1.5}
.b-sec ul{margin:0;padding-left:22px;font-size:18px;line-height:1.5}
.b-sec li{margin:2px 0}
.brief.emergency .b-sec:first-of-type p{font-size:21px;font-style:italic}
.brief.revealed{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px var(--accent-soft)}
.brief.revealed .b-type{border-color:var(--accent);color:var(--bg);background:var(--accent)}

/* ---------- Reveal banner ---------- */
.toast{position:fixed;left:50%;top:132px;z-index:70;transform:translateX(-50%);max-width:min(92vw,720px);
  padding:14px 22px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--panel-hi);
  box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 1px var(--accent-soft);font-family:var(--f-display);
  font-size:clamp(18px,2.4vw,24px);letter-spacing:var(--label-track);text-transform:var(--label-case);
  color:var(--accent);text-align:center;animation:pulse 1.6s ease-in-out 3}
.toast[hidden]{display:none}
.b-env{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--f-data);font-size:15px}
.b-env span b{color:var(--dim);font-weight:400;margin-right:6px}
.b-empty{color:var(--dim);text-align:center;padding:40px 10px;font-family:var(--f-data)}

/* ---------- Crest ---------- */
.crest{display:block;color:var(--text)}
.crest .ac{stroke:var(--accent);fill:none}
.crest .acf{fill:var(--accent)}
.crest .ink{fill:currentColor}
.crest .line{fill:none;stroke:currentColor}
.crest .neg{fill:var(--bg)}

/* ---------- Boot ---------- */
.boot{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at center,var(--boot-glow) 0%,var(--bg) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;cursor:pointer}
.boot[hidden]{display:none}
.boot .crest{width:min(62vw,46vh);height:auto}
.boot-net{font-family:var(--f-display);font-size:clamp(22px,4vw,36px);letter-spacing:.12em;text-transform:uppercase}
.boot-motto{font-family:var(--f-display);color:var(--accent);letter-spacing:.3em;text-transform:uppercase;font-size:clamp(14px,2vw,18px)}
.boot-go{margin-top:18px;padding:14px 28px;border:1px solid var(--line-hi);border-radius:var(--radius);
  font-family:var(--f-data);letter-spacing:.14em;text-transform:uppercase;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.boot-noscript{max-width:min(90vw,560px);padding:12px 16px;border:1px solid var(--alert);color:var(--alert);font-family:var(--f-data);font-size:15px;line-height:1.5;letter-spacing:.04em}
.boot-lines{width:min(90vw,640px);text-align:left;font-family:var(--f-data);font-size:clamp(15px,2.2vw,20px);
  line-height:1.6;text-transform:uppercase;letter-spacing:.06em;color:var(--ok)}
.boot-lines[hidden]{display:none}
.boot-lines .bad{color:var(--alert)}
.boot-lines .amb{color:var(--warn)}
.boot.alert-boot .boot-net{color:var(--line-hi)}

/* ---------- Attack sequence ---------- */
.seq{position:fixed;inset:0;z-index:90;background:#000;display:grid;place-items:center;overflow:hidden}
.seq[hidden]{display:none}
.seq>*{grid-area:1/1}
.seq .crest{width:min(62vw,46vh);height:auto;color:var(--crest-ink,#eef3f9);--accent:var(--crest-accent,#c9a24a);--bg:#000}
.seq canvas{width:100vw;height:100vh;image-rendering:pixelated;opacity:0}
.seq-text{align-self:center;justify-self:center;width:min(90vw,760px);font-family:"Roboto Mono","Droid Sans Mono","DejaVu Sans Mono",monospace;
  color:#66e07a;font-size:clamp(16px,2.6vw,24px);line-height:1.6;text-transform:uppercase;letter-spacing:.06em}
.seq-text .bad{color:#ff4b3e}
.seq-text .amb{color:#ffb000}
.seq-lost{font-family:"Roboto Mono","Droid Sans Mono",monospace;font-size:clamp(28px,6vw,64px);color:#fff;
  letter-spacing:.12em;text-shadow:0 0 18px #000,0 0 4px #000;opacity:0}
.seq.p1 .crest{animation:tear .32s steps(1) infinite}
.seq.p2 .crest,.seq.p3 .crest{display:none}
.seq.p2 canvas{opacity:1}
.seq.p2 .seq-lost{opacity:1;animation:flick .18s steps(1) infinite}
.seq.p3 canvas{opacity:.18}
.seq.p3 .seq-lost{display:none}
@keyframes tear{
  0%{transform:none;filter:none;clip-path:none}
  20%{transform:translateX(-18px) skewX(8deg);clip-path:inset(12% 0 55% 0);filter:hue-rotate(90deg) saturate(3)}
  40%{transform:translateX(22px);clip-path:inset(48% 0 20% 0);filter:invert(1)}
  60%{transform:translateY(-10px) scale(1.04);clip-path:inset(0 0 70% 0);filter:contrast(3)}
  80%{transform:translateX(-8px);clip-path:inset(70% 0 0 0);filter:brightness(2) hue-rotate(-80deg)}}
@keyframes flick{50%{opacity:.4}}

/* ---------- GM panel ---------- */
.gm{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:14px}
.gm[hidden]{display:none}
.gm-box{width:min(560px,100%);max-height:100%;overflow:auto;background:#0b0f14;border:1px solid #445;
  border-radius:10px;padding:16px;color:#e6edf5;font-family:"Roboto","Noto Sans",sans-serif}
.gm-box h2{margin:0 0 4px;font-size:20px}
.gm-klaxon{margin:4px 0 10px;padding:8px 10px;border:1px solid #445;border-radius:8px;background:#10161e}
.gm-klaxon strong{display:block;font-size:16px}
.gm-klaxon span{display:block;margin-top:2px;font-size:13px;color:#9aa8b8;overflow-wrap:anywhere}
.gm-klaxon[data-mode="file"],.gm-klaxon[data-mode="embedded"]{border-color:#2f7a45}
.gm-klaxon[data-mode="file"] strong,.gm-klaxon[data-mode="embedded"] strong{color:#66e07a}
.gm-klaxon[data-mode="builtin"] strong{color:#ffb000}
.gm-status{margin:0 0 12px;font-family:"Roboto Mono","Droid Sans Mono",monospace;color:#ffb000;font-size:15px}
.gm-box h3{margin:14px 0 8px;font-size:14px;color:#9aa8b8;font-weight:500;letter-spacing:.06em}
.gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gm-btn{min-height:48px;border:1px solid #445;background:#141b24;color:#e6edf5;border-radius:8px;cursor:pointer;font-size:16px}
.gm-btn:active{background:#1f2a38}
.gm-btn.fire{border-color:#ef5350;color:#fff;background:#4a1411}
.gm-btn.wide{grid-column:1/-1}
.gm-btn[aria-pressed="true"]{border-color:#ffb000;color:#ffb000}
.gm-btn[hidden],.gm-klaxon[hidden],#gmTrigBlock[hidden],#gmTrigHead[hidden],#gmTrigs[hidden]{display:none}
.gm-stamp{margin:0 0 8px;font-family:"Roboto Mono","Droid Sans Mono",monospace;font-size:12px;color:#7d8a99;overflow-wrap:anywhere}

/* ---------- Deep Scan ---------- */
.deep{max-width:1500px;margin:0 auto;padding:14px;display:grid;gap:12px;grid-template-columns:240px minmax(0,1fr);align-items:start}
.deep.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.deep{grid-template-columns:minmax(0,1fr)}}
.cat{display:flex;flex-direction:column;gap:8px;position:sticky;top:132px;max-height:calc(100vh - 146px)}
@media (max-width:900px){.cat{position:static;max-height:none}.cat-list{max-height:210px}}
.cat input{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:var(--radius);font-family:var(--f-data);font-size:15px}
.cat-list{display:grid;gap:4px;overflow:auto;align-content:start;min-height:0}
.cat-item{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:8px;min-height:44px;padding:6px 10px;
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);cursor:pointer;text-align:left;
  font-family:var(--f-data);font-size:14px}
.cat-item[hidden]{display:none}
.cat-item[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.cat-n,.cat-cls{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds{display:grid;gap:12px;min-width:0;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  grid-template-areas:"head head" "wire orbit" "wire bars" "read hazard"}
@media (max-width:700px){.ds{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "wire" "orbit" "bars" "read" "hazard"}}
.ds-head{grid-area:head;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ds-wire{grid-area:wire;display:flex;flex-direction:column}.ds-orbit{grid-area:orbit}.ds-bars{grid-area:bars}
.ds-read{grid-area:read}.ds-hazard{grid-area:hazard}
.ds-kicker{font-family:var(--f-data);font-size:13px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.ds-name{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:.95;
  letter-spacing:var(--name-track);text-transform:uppercase}
.ds-class{margin-top:8px;font-family:var(--f-display);font-size:clamp(15px,1.9vw,20px);color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
.ds-hab{text-align:right}
.ds-hab b{display:block;font-family:var(--f-data);font-size:clamp(32px,5vw,52px);font-weight:400;color:var(--line-hi);line-height:1}
.ds-hab small{font-size:12px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.wire-wrap{position:relative;flex:1;width:100%;aspect-ratio:1;min-height:280px}
.wire-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.d-globe .wire-wrap{aspect-ratio:auto;min-height:340px}
.ds-cap{margin-top:8px;font-family:var(--f-data);font-size:13px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.orbit-svg{display:block;width:100%;height:auto}
.cbar{margin:8px 0 16px}
.cb-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--dim);letter-spacing:var(--label-track);text-transform:var(--label-case)}
.cb-top b{font-family:var(--f-data);font-weight:400;color:var(--text);text-align:right}
.cb-track{position:relative;height:12px;margin-top:6px;border:1px solid var(--line);background:var(--bg2)}
.cb-band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.cb-mark{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--dim)}
.cb-val{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--accent)}
.cb-val.over{background:var(--alert)}
.cb-scale{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--f-data);font-size:11px;color:var(--dim)}
.gv{color:var(--warn);font-family:var(--f-data);letter-spacing:.12em;text-transform:uppercase}
.est{margin-left:8px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.hz-list{display:flex;flex-wrap:wrap;gap:8px}
.hz{padding:5px 10px;border:1px solid var(--alert);color:var(--alert);font-family:var(--f-data);font-size:13px;letter-spacing:.08em}
.hz.ok{border-color:var(--ok);color:var(--ok)}

.fatal{padding:40px 20px;text-align:center;color:var(--warn);font-family:var(--f-data)}

/* ---------- ANDIS terminal (signals) ---------- */
.tb-term{display:inline-flex;align-items:center;gap:8px}
.tb-term[hidden]{display:none !important}
.tb-term .ring{width:18px;height:18px;transform:rotate(-90deg)}
.tb-term .ring circle{fill:none;stroke:var(--line);stroke-width:3}
.tb-term .ring .ring-v{stroke:var(--accent);stroke-dasharray:44 44;stroke-dashoffset:44}
.tb-term.done{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.tm{position:fixed;inset:0;z-index:60;background:#0b0f14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tm[hidden]{display:none}
.tm-stage{position:absolute;left:0;top:0;width:1088px;height:680px;transform-origin:0 0;font-family:"Roboto Mono","Droid Sans Mono",monospace}
.tm-top{position:absolute;left:0;right:0;top:0;height:40px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e2a36;font-size:13px;letter-spacing:.12em;color:#9fb2c6}
.tm-close{height:34px;min-width:88px;padding:0 14px;background:transparent;border:1px solid #3a4c5e;border-radius:4px;color:#c8d6e4;font:inherit;font-size:12px;letter-spacing:.14em;cursor:pointer}
.tm-mon{position:absolute;left:214px;top:54px;width:660px;height:372px;box-sizing:border-box;padding:18px 22px 42px;background:#d6ccb8;border-radius:22px;box-shadow:inset 0 -6px 0 #b9ae98,0 12px 30px rgba(0,0,0,.5)}
.tm-bezel{width:100%;height:100%;box-sizing:border-box;padding:14px;background:#24201c;border-radius:14px}
.tm-glass{position:relative;width:100%;height:100%;box-sizing:border-box;padding:14px;background:#6C5EB5;border-radius:10px;overflow:hidden}
.tm-glass::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 70px rgba(0,0,0,.55)}
.tm-glass.off{background:#0c0c12}
.tm-glass.off .tm-cv{visibility:hidden}
.tm-glass.load{background:repeating-linear-gradient(180deg,#6C5EB5 0 9px,#EDF171 9px 13px,#9AE29B 13px 21px,#352879 21px 25px,#A1683C 25px 31px);background-size:100% 31px;animation:tmStripe .24s steps(4) infinite}
@keyframes tmStripe{to{background-position:0 31px}}
.tm-cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#2B2170;touch-action:none}
.tm-glass.warm .tm-cv{animation:tmWarm .8s ease-out}
@keyframes tmWarm{0%{transform:scale(.7,.004);filter:brightness(5)}35%{transform:scale(1,.012);filter:brightness(4)}70%{transform:scale(1,1.02);filter:brightness(1.6)}100%{transform:none;filter:none}}
.tm-glass.degauss .tm-cv{animation:tmDegauss .4s ease-out}
@keyframes tmDegauss{0%{transform:skewX(4deg);filter:hue-rotate(90deg)}30%{transform:skewX(-3deg);filter:hue-rotate(-60deg)}60%{transform:skewX(1.5deg)}100%{transform:none;filter:none}}
.tm-glass.zap .tm-cv{animation:tmZap .3s steps(3)}
@keyframes tmZap{50%{filter:invert(1) hue-rotate(180deg)}}
.tm-badge{position:absolute;left:28px;bottom:13px;font-size:13px;letter-spacing:.18em;color:#4b4236}
.tm-power{position:absolute;right:30px;bottom:16px;width:10px;height:10px;border-radius:50%;background:#3a3a34}
.tm-power.on{background:#5ad16a;box-shadow:0 0 8px #5ad16a}
.tm-drive{position:absolute;right:56px;bottom:12px;display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;color:#8a7f6c}
.tm-drive i{display:block;width:10px;height:10px;border-radius:50%;background:#4a2a24}
.tm-drive.on i{background:#ff4d3a;box-shadow:0 0 8px #ff4d3a}
.tm-jack{position:absolute;right:-6px;top:268px;width:10px;height:18px;background:#2c2c2c;border-radius:3px}
.tm-kb{position:absolute;left:114px;top:444px;width:860px;height:222px;box-sizing:border-box;padding:18px 20px;background:#cfc9bb;border-radius:16px 16px 22px 22px;box-shadow:inset 0 3px 0 #e3ddd0,0 10px 0 #a39c8c}
.tm-keys{display:flex;flex-direction:column;gap:6px}
.tm-keys.dead,.tm-fkeys.dead{opacity:.55}
.tm-row{display:flex;gap:6px}
.tm-key{width:62px;height:32px;padding:0;background:#1c1b1a;color:#ece6da;border:0;border-radius:5px;box-shadow:0 3px 0 #000;font:inherit;font-size:15px;cursor:pointer;touch-action:none}
.tm-key.w2{width:130px}.tm-key.space{width:476px}.tm-key.ret{width:198px}
.tm-key.w2,.tm-key.space,.tm-key.ret{font-size:14px;letter-spacing:.1em}
.tm-key.down{transform:translateY(2px);box-shadow:0 1px 0 #000;background:#2c2a28}
.tm-fkeys{position:absolute;left:718px;top:18px;display:flex;flex-direction:column;gap:8px}
.tm-fkeys .tm-key{width:60px;height:38px;font-size:14px}
.tm-port{position:absolute;right:16px;top:10px;width:52px;height:28px;background:#1b1612;border-radius:6px;box-shadow:inset 0 2px 4px #000}
.tm-led{position:absolute;right:35px;top:48px;width:14px;height:14px;border-radius:50%;background:#5a4a44}
.tm-led.on{background:#ff4d3a;box-shadow:0 0 10px #ff4d3a}
.tm-led.blink{animation:tmBlink .2s steps(2) 4}
@keyframes tmBlink{50%{background:#ffb000;box-shadow:0 0 10px #ffb000}}
.tm-ser{position:absolute;right:27px;top:66px;font-size:11px;letter-spacing:.14em;color:#4b4236}
.tm-wire{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tm-wire path{fill:none;stroke-linecap:round}
#tmCable0{stroke:#1a1a1a;stroke-width:9}
#tmCable1{stroke:#3b3b3b;stroke-width:5}
.tm-plug{position:absolute;width:24px;height:34px;box-sizing:border-box;background:#2c2c2c;border:1.5px solid #555;border-radius:4px;cursor:grab;touch-action:none}
.tm-plug i{position:absolute;inset:-22px}
.tm-plug::before,.tm-plug::after{content:"";position:absolute;bottom:-9px;width:4px;height:8px;background:#b9a36a}
.tm-plug::before{left:4px}.tm-plug::after{right:4px}
.tm-plug.drag{cursor:grabbing}
.tm-plug.in{cursor:default}
.tm-plug.in::before,.tm-plug.in::after{display:none}
.tm-hint{position:absolute;width:100px;text-align:center;font-size:12px;line-height:16px;letter-spacing:.1em;color:#f0b44c;animation:pulse 1.6s ease-in-out infinite}
.tm-hint[hidden]{display:none}
.tm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tm-printer{position:absolute;left:892px;top:64px;width:180px;height:200px;cursor:pointer}
.port .tm-printer{left:340px;top:1000px;height:176px}
.tm-pbody{position:absolute;left:0;right:0;bottom:0;height:86px;background:#d6ccb8;border-radius:12px 12px 8px 8px;box-shadow:inset 0 -5px 0 #b9ae98,0 8px 18px rgba(0,0,0,.45)}
.tm-pslot{position:absolute;left:16px;right:16px;top:10px;height:10px;background:#24201c;border-radius:4px}
.tm-plabel{position:absolute;left:14px;bottom:12px;font-size:11px;letter-spacing:.16em;color:#4b4236}
.tm-plight{position:absolute;right:16px;bottom:15px;width:9px;height:9px;border-radius:50%;background:#5a4a44}
.tm-plight.on{background:#f2c14e;box-shadow:0 0 8px #f2c14e;animation:pulse .5s steps(2) infinite}
.tm-paper{position:absolute;left:24px;width:132px;bottom:66px;height:0;overflow:hidden;background:#f2efe6;box-shadow:0 0 0 1px #d8d2c4}
.tm-paper.out{height:118px}
.port .tm-paper.out{height:96px}
.tm-paper::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,#b9b2a3 2px,transparent 2.6px) 0 4px/10px 10px repeat-y,radial-gradient(circle,#b9b2a3 2px,transparent 2.6px) 100% 4px/10px 10px repeat-y}
.tm-paper::after{content:"";position:absolute;left:16px;right:16px;top:8px;bottom:8px;background:linear-gradient(#5b574f,#5b574f) 0 0/60% 5px no-repeat,repeating-linear-gradient(180deg,#8b867b 0 2px,transparent 2px 6px) 0 12px/100% calc(100% - 12px) no-repeat;filter:blur(.6px);opacity:.7}
.tm-stage.port{width:860px;height:1180px}
.port .tm-mon{left:30px;top:60px;width:800px;height:520px}
.port .tm-jack{top:400px}
.port .tm-kb{left:0;top:660px;width:860px;height:340px}
.port .tm-keys{gap:9px}
.port .tm-key{height:52px}
.port .tm-fkeys{gap:10px}
.port .tm-fkeys .tm-key{height:62px}
.gm-btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div class="bar">
  <div class="net"><span class="net-mark" aria-hidden="true"></span><span class="net-name" id="netName"></span></div>
  <span class="clock" id="clock"></span>
  <button class="tb tb-term" id="bTerm" type="button" hidden aria-label="ANDIS terminal"><svg class="ring" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><circle class="ring-v" id="bTermRing" cx="10" cy="10" r="7"></circle></svg>ANDIS</button>
  <button class="tb" id="bMotion" type="button" aria-pressed="true">Motion</button>
  <button class="tb" id="bFull" type="button">Fullscreen</button>
</div>
<template id="crestTpl"><!--__CREST__--></template>
<nav class="tabs" role="tablist" aria-label="Display">
  <button class="tab" id="tabScan" type="button" role="tab" aria-selected="true">Scan</button>
  <button class="tab" id="tabBriefs" type="button" role="tab" aria-selected="false">Briefs<span class="count" id="briefCount"></span></button>
  <button class="tab" id="tabDeep" type="button" role="tab" aria-selected="false">Deep Scan</button>
</nav>
<div class="view" id="viewScan">
<nav class="worlds" id="worlds" hidden aria-label="Worlds"></nav>
<main class="dossier" id="dossier" aria-live="polite"></main>
</div>
<div class="view" id="viewBriefs" hidden><section class="briefs" id="briefs" aria-live="polite"></section></div>
<div class="view" id="viewDeep" hidden><section class="deep" id="deep"></section></div>

<div class="boot" id="boot" role="button" tabindex="0" aria-label="Connect">
  <div id="bootCrest"></div>
  <div class="boot-net" id="bootNet"></div>
  <div class="boot-motto" id="bootMotto"></div>
  <div class="boot-lines" id="bootLines" hidden></div>
  <div class="boot-go">Tap to connect</div>
  <noscript><style>.boot-go{display:none}</style><div class="boot-noscript">Sensor suite offline.  This display needs JavaScript.<br>Allow scripts for this page in your browser or script blocker, then reload.</div></noscript>
</div>

<div class="seq" id="seq" hidden aria-hidden="true">
  <div id="seqCrest"></div>
  <canvas id="seqNoise" width="200" height="120"></canvas>
  <div class="seq-lost" id="seqLost">Signal lost</div>
  <div class="seq-text" id="seqText"></div>
</div>

<div class="tm" id="tm" hidden role="dialog" aria-modal="true" aria-label="ANDIS terminal">
  <div class="tm-stage" id="tmStage">
    <div class="tm-top"><span>GMS SENSOR SUITE // AUX TERMINAL</span><button class="tm-close" id="tmClose" type="button">CLOSE</button></div>
    <div class="tm-mon" id="tmMon">
      <div class="tm-bezel"><div class="tm-glass off" id="tmGlass"><canvas class="tm-cv" id="tmCv" aria-hidden="true"></canvas></div></div>
      <div class="tm-badge">ANDIS UN.#30</div>
      <div class="tm-drive" id="tmDrive"><i></i>DRIVE</div>
      <div class="tm-power" id="tmPower"></div>
      <div class="tm-jack" id="tmJack"></div>
    </div>
    <div class="tm-kb" id="tmKb">
      <div class="tm-keys dead" id="tmKeys"></div>
      <div class="tm-fkeys dead" id="tmFkeys"></div>
      <div class="tm-port" id="tmPort"></div>

<script>
"use strict";
const DATA = /*__DATA__*/null;

(() => {
  const $ = id => document.getElementById(id);
  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  const ICONS = {
    data:"M4 20V10M10 20V4M16 20v-7M22 20H2",
    thermal:"M10 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0zM13 9v8",
    feed:"M3 7h13v10H3zM16 10l5-3v10l-5-3",
    doc:"M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h5",
    natural:"M3 20 9 8l4 7 3-5 5 10z",
    settle:"M3 21h18M5 21V10h6v11M11 21V5h7v16",
    built:"M3 21h18M6 21V9l5-3v15M11 21V3h5v18M16 21v-9h3v9",
    eye:"M2 12c5-8 15-8 20 0-5 8-15 8-20 0zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6",
    ground:"M2 18c4-5 7-5 10-2s6 3 10-2M2 21h20M7 10l3-4 3 4",
    life:"M7 3c0 9 10 9 10 18M17 3C17 12 7 12 7 21M8 6h8M9 10h6M9 14h6M8 18h8",
    lock:"M6 11h12v10H6zM9 11V8a3 3 0 0 1 6 0v3",
    globe:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18",
  };
  function icon(name){
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(ns, "path"); p.setAttribute("d", ICONS[name] || ICONS.doc);
    s.append(p); return s;
  }
  function head(label, ic, more){
    const h = el("h3", "ph"); h.append(icon(ic), document.createTextNode(label));
    if (more) h.append(el("span", "more", more));
    return h;
  }
  // "Remote: text" or "Remote — text" -> ["Remote", "text"]
  function splitLead(t){
    if (!t) return [null, t];
    const m = t.match(/^(.{1,48}?)(?::\s+|\s+\u2014\s+)(.+)$/s);
    return m ? [m[1], m[2]] : [null, t];
  }
  const short = t => splitLead(t)[0] || t;

  if (!DATA || !Array.isArray(DATA.worlds) || !DATA.worlds.length){
    $("dossier").append(el("p","fatal","This is the OMNISLATE engine template, with no session in it.  Open a session file from the dist folder instead, such as dist/<campaign>/session-1.html."));
    return;
  }

  /* ---------- Settings ---------- */
  const root = document.documentElement;
  // Campaign theme from campaign.md.  Two skin roles: normal, and alert (after an attack trigger or Start: alert).
  const CAMP = DATA.campaign || {};
  const SKINS = {
    normal: Object.assign({style:"institutional", network:"Sensor Network", colors:{}}, CAMP.normal || {}),
    alert: Object.assign({style:"military", network:"Emergency mode", colors:{}, bootLines:[]}, CAMP.alert || {}),
  };
  if (DATA.session.network) SKINS.normal.network = DATA.session.network;
  const STYLE_INK = {institutional:["#eef3f9", "#c9a24a"], military:["#d9ffdc", "#ffb000"]};
  const COLOR_VARS = ["--bg", "--bg2", "--panel", "--panel-hi", "--line", "--line-hi", "--text", "--dim", "--accent", "--accent-soft", "--alert", "--boot-glow"];
  (function crestInk(){
    const n = SKINS.normal, d = STYLE_INK[n.style] || STYLE_INK.institutional, c = n.colors || {};
    root.style.setProperty("--crest-ink", c["--text"] || d[0]);
    root.style.setProperty("--crest-accent", c["--accent"] || d[1]);
  })();
  const startAlert = DATA.session.start === "alert";
  const fired = new Set();
  let preview = "normal";
  let motion = true;
  let alertOn = startAlert;
  function applySkin(){
    const role = alertOn ? "alert" : preview;
    const sk = SKINS[role];
    root.dataset.skin = role;
    root.dataset.style = sk.style === "military" ? "military" : "institutional";
    root.dataset.alert = role === "alert" ? "on" : "off";
    COLOR_VARS.forEach(v => root.style.removeProperty(v));
    Object.entries(sk.colors || {}).forEach(([k, v]) => root.style.setProperty(k, v));
    $("netName").textContent = sk.network;
    if (globe) globe.setSkin();
    wireKick();
  }
  function applyMotion(){
    root.classList.toggle("no-motion", !motion);
    $("bMotion").setAttribute("aria-pressed", String(motion));
    $("bMotion").textContent = motion ? "Motion: On" : "Motion: Off";
    Noise.setRunning(motion);
    if (globe) globe.setAuto(motion);
    document.querySelectorAll("video").forEach(v => { if (motion) v.play().catch(() => {}); else v.pause(); });
    wireKick();
  }
  $("bMotion").addEventListener("click", () => { motion = !motion; applyMotion(); });
  $("bFull").addEventListener("click", async () => {
    try{
      if (document.fullscreenElement) await document.exitFullscreen();
      else await root.requestFullscreen({navigationUI:"hide"});
    }catch(e){}
    wake();
  });
  let lock = null;
  async function wake(){
    try{ if ("wakeLock" in navigator && !lock){ lock = await navigator.wakeLock.request("screen");
      lock.addEventListener("release", () => { lock = null; }); } }catch(e){}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  document.addEventListener("pointerdown", wake, {once:true});

  function tick(){
    const d = new Date();
    $("clock").textContent = d.toTimeString().slice(0,8);
    document.querySelectorAll("[data-ts]").forEach(n => { n.textContent = d.toTimeString().slice(0,8); });
  }
  setInterval(tick, 1000); tick();

  function glitch(node){
    if (!motion || !node) return;
    node.classList.remove("glitch"); void node.offsetWidth; node.classList.add("glitch");
  }
  document.addEventListener("animationend", e => { if (e.animationName === "glitch") e.target.classList.remove("glitch"); });

  /* ---------- Static noise (signal pending) ---------- */
  const Noise = (() => {
    const set = new Set(); let running = true, last = 0;
    function paint(c){
      const w = c.width, h = c.height, ctx = c.getContext("2d");
      const img = ctx.createImageData(w, h), d = img.data;
      for (let i = 0; i < d.length; i += 4){
        const v = Math.random() * 90 | 0; d[i] = v; d[i+1] = v + 6; d[i+2] = v + 14; d[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    function loop(t){
      if (t - last > 80){ last = t; set.forEach(c => { if (c.isConnected) paint(c); else set.delete(c); }); }
      if (running && set.size) requestAnimationFrame(loop);
    }
    return {
      make(){ const c = el("canvas", "noise"); c.width = 160; c.height = 90; paint(c); set.add(c);
        if (running && set.size === 1) requestAnimationFrame(loop); return c; },
      setRunning(on){ const was = running; running = on; if (on && !was) requestAnimationFrame(loop); },
    };
  })();

  function frame(src, shape, pendingTitle, pendingSub, alt){
    const f = el("div", "frame fx " + shape);
    if (src){ const i = el("img"); i.src = src; i.alt = alt || ""; i.decoding = "async"; f.append(i); }
    else {
      f.append(Noise.make());
      const s = el("div", "signal"); s.append(el("b", null, pendingTitle), el("span", null, pendingSub)); f.append(s);
    }
    return f;
  }

  /* ---------- Live media beside the file (videos, stills) ---------- */
  // Order per feed: <slug>-<kind>.mp4/.webm beside this file, then a still
  // (.webp/.png/.jpg) beside this file, then the image embedded by the build, then static.
  const MEDIA = {};
  const mediaRefresh = new Set();
  function sib(name){ return new URL(name, location.href).href; }
  function probeVideo(url){
    return new Promise(res => {
      const v = document.createElement("video"); let done = false;
      const fin = ok => { if (done) return; done = true; v.removeAttribute("src"); try{ v.load(); }catch(e){} res(ok); };
      v.muted = true; v.preload = "metadata";
      v.addEventListener("loadedmetadata", () => fin(true), {once:true});
      v.addEventListener("error", () => fin(false), {once:true});
      setTimeout(() => fin(false), 5000);
      v.src = url;
    });
  }
  function probeImage(url){
    return new Promise(res => {
      const i = new Image(); let done = false;
      const fin = ok => { if (!done){ done = true; res(ok); } };
      i.onload = () => fin(i.naturalWidth > 0); i.onerror = () => fin(false);
      setTimeout(() => fin(false), 5000);
      i.src = url;
    });
  }
  async function findMedia(slug, kind, embedded){
    const rec = MEDIA[slug][kind];
    for (const ext of ["mp4", "webm"]){
      const url = sib(`${slug}-${kind}.${ext}`);
      if (await probeVideo(url)){ Object.assign(rec, {mode:"video", url, detail:`${slug}-${kind}.${ext} beside this file`}); return; }
    }
    for (const ext of ["webp", "png", "jpg"]){
      const url = sib(`${slug}-${kind}.${ext}`);
      if (await probeImage(url)){ Object.assign(rec, {mode:"image", url, detail:`${slug}-${kind}.${ext} beside this file`}); return; }
    }
    if (embedded){ Object.assign(rec, {mode:"image", url:embedded, detail:"Image embedded in this session file"}); return; }
    Object.assign(rec, {mode:"static", url:null, detail:`No ${slug}-${kind}.mp4, .webm, or image beside this file`});
  }
  (function scanMedia(){
    const jobs = [];
    DATA.worlds.forEach(w => {
      const slug = w.fields.slug; MEDIA[slug] = {};
      [["surface", w.fields.surface], ["thermal", w.fields.thermal], ["surface01", true]].forEach(([kind, allowed]) => {
        if (!allowed) return;
        MEDIA[slug][kind] = {mode:"checking", url:null, detail:"Checking for files"};
        jobs.push(findMedia(slug, kind, w.images[kind]).then(() => { mediaRefresh.forEach(fn => fn()); showMediaInfo(); }));
      });
    });
    Promise.all(jobs).then(showMediaInfo);
  })();
  function showMediaInfo(){
    const box = document.getElementById("gmMedia"); if (!box) return;
    box.replaceChildren();
    DATA.worlds.forEach(w => {
      const m = MEDIA[w.fields.slug] || {};
      [["surface", "drone 02 feed"], ["thermal", "thermal feed"], ["surface01", "drone 01 feed"]].forEach(([kind, label]) => {
        const r = m[kind]; if (!r) return;
        const name = {checking:"Checking...", video:"Video", image:"Still image", static:"Static"}[r.mode];
        const row = el("div"); row.dataset.mode = r.mode;
        row.append(el("b", null, `${w.name} ${label}: ${name}`), el("span", null, r.detail));
        box.append(row);
      });
    });
    if (!box.childNodes.length) box.append(el("div", null, "No feeds in this session file."));
  }
  // Builds the live content for one feed slot: video, still, or static.
  function mediaNode(slug, kind, lostTitle, lostSub, pendTitle, pendSub, stillClass){
    const r = (MEDIA[slug] || {})[kind];
    const frag = document.createDocumentFragment();
    if (!alertOn && r && r.mode === "video"){
      const v = document.createElement("video");
      v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = motion; v.preload = "auto";
      v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.setAttribute("disablepictureinpicture", "");
      v.src = r.url;
      if (motion) v.play().catch(() => {});
      frag.append(v); return frag;
    }
    if (!alertOn && r && r.mode === "image"){
      const i = el("img", stillClass || null); i.src = r.url; i.alt = ""; i.decoding = "async"; frag.append(i); return frag;
    }
    frag.append(Noise.make());
    const sg = el("div", "signal");
    if (alertOn) sg.append(el("b", null, lostTitle), el("span", null, lostSub));
    else sg.append(el("b", null, r && r.mode === "checking" ? "Acquiring signal" : pendTitle), el("span", null, pendSub));
    frag.append(sg);
    return frag;
  }
  function liveFrame(slug, kind, shape, lostTitle, lostSub, pendTitle, pendSub){
    const f = el("div", "frame fx " + shape);
    const paint = () => { f.replaceChildren(mediaNode(slug, kind, lostTitle, lostSub, pendTitle, pendSub)); };
    paint();
    mediaRefresh.add(() => { if (f.isConnected) paint(); });
    return f;
  }

  /* ---------- Globe (WebGL2) ---------- */
  function Globe(mapSrc){
    const wrap = el("div", "globe-wrap");
    const canvas = el("canvas"); wrap.append(canvas);
    const gl = canvas.getContext("webgl2", {alpha:true, premultipliedAlpha:true, antialias:true});
    const api = { wrap, ok:false, setAuto(){}, setSkin(){}, resize(){} };
    if (!gl || !mapSrc) return api;
    const vs = `#version 300 es
      in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
    const fs = `#version 300 es
      precision highp float;
      uniform sampler2D uTex; uniform vec2 uRes; uniform float uR, uYaw, uPitch; uniform vec3 uSun, uAtmo;
      out vec4 o;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      void main(){
        vec2 p = (gl_FragCoord.xy - 0.5*uRes) / uR;
        float r = length(p);
        float px = 1.5 / uR;
        vec3 col = vec3(0.); float a = 0.;
        float star = step(0.9982, hash(floor(gl_FragCoord.xy))) * smoothstep(1.2, 1.35, r);
        col += vec3(star * 0.7); a += star * 0.7;
        if (r < 1.0 + px){
          float d = min(dot(p,p), 1.0);
          vec3 n = vec3(p, sqrt(1.0 - d));
          float cp = cos(uPitch), sp = sin(uPitch);
          vec3 w = vec3(n.x, cp*n.y - sp*n.z, sp*n.y + cp*n.z);
          float cy = cos(uYaw), sy = sin(uYaw);
          w = vec3(cy*w.x + sy*w.z, w.y, -sy*w.x + cy*w.z);
          float lat = asin(clamp(w.y, -1., 1.));
          float lon = atan(w.x, w.z);
          float u1 = lon / 6.2831853 + 0.5;
          float u2 = fract(u1 + 0.5) - 0.5;
          float u = fwidth(u1) <= fwidth(u2) + 1e-6 ? u1 : u2;
          vec3 t = texture(uTex, vec2(u, 0.5 - lat / 3.14159265)).rgb;
          float ndl = dot(n, uSun);
          float day = smoothstep(-0.18, 0.55, ndl);
          vec3 lit = t * (0.035 + 1.08 * day);
          float ocean = smoothstep(0.03, 0.14, t.b - max(t.r, t.g));
          vec3 h = normalize(uSun + vec3(0.,0.,1.));
          lit += vec3(1.,.96,.9) * pow(max(dot(n,h),0.), 70.) * ocean * day * 0.55;
          float fres = pow(1.0 - n.z, 2.6);
          lit += uAtmo * fres * (0.12 + 0.85 * smoothstep(-0.35, 0.6, ndl));
          float edge = clamp((1.0 - r) / px, 0., 1.);
          col = mix(col, lit, edge); a = mix(a, 1.0, edge);
        }
        if (r > 1.0 - px){
          float g = exp(-(r - 1.0) * 26.0) * step(1.0 - px, r);
          vec2 dir = normalize(p);
          float side = clamp(dot(vec3(dir, 0.25), uSun) * 0.8 + 0.45, 0.12, 1.0);
          float glow = g * side * (r > 1.0 ? 1.0 : 0.0);
          col += uAtmo * glow; a = max(a, glow);
        }
        o = vec4(col, a);
      }`;
    function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
    let prog;
    try{
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    }catch(e){ console.warn(e); return api; }
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(prog, n);
    const uRes = U("uRes"), uR = U("uR"), uYaw = U("uYaw"), uPitch = U("uPitch"), uSun = U("uSun"), uAtmo = U("uAtmo");
    const s = [-0.55, 0.38, 0.74], sl = Math.hypot(...s);
    gl.uniform3f(uSun, s[0]/sl, s[1]/sl, s[2]/sl);
    const tex = gl.createTexture();
    let ready = false;
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      const an = gl.getExtension("EXT_texture_filter_anisotropic");
      if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
      ready = true; kick();
    };
    img.src = mapSrc;

    let yaw = 0, pitch = 0.3, vy = 0, auto = true, dragging = false, lx = 0, ly = 0, raf = 0, lt = 0, visible = true;
    const SPIN = Math.PI * 2 / 150;
    function size(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, wrap.clientWidth * dpr | 0), h = Math.max(1, wrap.clientHeight * dpr | 0);
      if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, w, h); gl.uniform1f(uR, Math.min(w, h) * 0.45);
    }
    function draw(){
      size();
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(uYaw, yaw); gl.uniform1f(uPitch, pitch);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    function frameLoop(t){
      raf = 0;
      const dt = lt ? Math.min(0.05, (t - lt) / 1000) : 0; lt = t;
      if (!dragging){
        if (Math.abs(vy) > 0.0005){ yaw += vy; vy *= 0.94; }
        else vy = 0;
        if (auto) yaw += SPIN * dt;
      }
      if (ready) draw();
      if (visible && (auto || dragging || vy)) raf = requestAnimationFrame(frameLoop);
      else lt = 0;
    }
    function kick(){ if (!raf) raf = requestAnimationFrame(frameLoop); }
    wrap.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; dragging = true; lx = e.clientX; ly = e.clientY; vy = 0;
      wrap.setPointerCapture(e.pointerId); wrap.style.cursor = "grabbing"; kick(); });
    wrap.addEventListener("pointermove", e => {
      if (!dragging) return;
      const R = Math.min(wrap.clientWidth, wrap.clientHeight) * 0.45 || 1;
      const dx = (e.clientX - lx) / R, dy = (e.clientY - ly) / R;
      lx = e.clientX; ly = e.clientY;
      yaw -= dx; vy = -dx; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy));
      kick();
    });
    const end = () => { dragging = false; wrap.style.cursor = ""; kick(); };
    wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
    new ResizeObserver(() => { if (ready) draw(); }).observe(wrap);

  const DIRTYPE = { T:"SEQ", I:"USR", D:"PRG", A:"SND", V:"VID" };
  function openAct(a){
    if (a === "back") return goBack();
    if (a.kind === "D") return startPrint([a]);
    if (a.kind === "P") return startPrint(a.items);
    if (a.kind === "A" || a.kind === "V") return startMedia(a);
    const view = { kind: a.kind, rows: [] };
    backRows(view.rows);
    if (a.kind === "T"){
      view.rows.push({ cls:"hi", cs: cells(a.name) }); view.rows.push(blank());
      (a.text || []).forEach(([cls, line]) => wrap(line, TM.cols).forEach(cs => view.rows.push({ cls, cs })));
    } else if (a.kind === "I"){
      view.rows.push({ cls:"hi", cs: cells(a.name) });
      if (a.caption) wrap(a.caption, TM.cols).forEach(cs => view.rows.push({ cls:"", cs }));
      addImage(view, a.image);
    } else if (a.kind === "M"){
      const head = `0 "${a.name.padEnd(16)}" AN 2A`;
      view.rows.push({ cls:"hi", cs: cells(head.slice(0, TM.cols)) }); view.rows.push(blank());
      let used = 0;
      a.items.forEach(it => {
        const b = blocks(it.name); used += b;
        const line = `${String(b).padEnd(4)}${('"' + it.name + '"').padEnd(19)}${DIRTYPE[it.kind]}`;
        view.rows.push({ cls:"", cs: cells(line.slice(0, TM.cols)), act: it }); view.rows.push(blank(it));
      });
      const prints = a.items.filter(it => it.kind === "D");
      if (prints.length > 1){
        const line = `${"0".padEnd(4)}${'"PRINT ALL"'.padEnd(19)}PRG`;
        const all = { kind:"P", name:"PRINT ALL", items: prints };
        view.rows.push({ cls:"amb", cs: cells(line.slice(0, TM.cols)), act: all }); view.rows.push(blank(all));
      }
      view.rows.push({ cls:"", cs: cells(`${Math.max(0, 664 - used)} BLOCKS FREE.`) });
    }
    pushView(view);
  }

  /* audio and video: content, so they play whatever the Sound switch says (it covers effects only) */
  const mediaEls = {};
  function startMedia(a){
    stopMedia();
    const key = a.kind + ":" + a.name;
    let el = mediaEls[key];
    if (!el){
      el = document.createElement(a.kind === "A" ? "audio" : "video");
      el.preload = "auto"; el.playsInline = true; el.setAttribute("playsinline", "");
      el.addEventListener("error", () => { if (TM.media && TM.media.el === el){ TM.media.err = true; tmDraw(); } });
      el.addEventListener("ended", () => tmDraw());
      el.src = a.kind === "A" ? a.audio : a.video;
      if (a.loop) el.loop = true;   // 3.6.2: a file named *loop* repeats until closed
      mediaEls[key] = el;
    }
    TM.stack.push(TM.reveal);
    TM.media = { a, el, err: false, an: null };
    if (a.kind === "A" && actx){
      try{
        if (!el._an){ const src = actx.createMediaElementSource(el), an = actx.createAnalyser();
          an.fftSize = 128; src.connect(an); an.connect(actx.destination); el._an = an; }
        TM.media.an = el._an; actx.resume();
      }catch(e){}
    }
    try{ el.currentTime = 0; }catch(e){}
    el.play().catch(() => {});
    TM.mode = "media"; tmDraw();
  }
  function stopMedia(){ if (TM.media){ try{ TM.media.el.pause(); }catch(e){} TM.media = null; } }
  function mediaBack(){ stopMedia(); TM.reveal = TM.stack.pop() || TM.reveal; TM.mode = "reveal"; tmDraw(); }
  function mediaToggle(){
    const el = TM.media && TM.media.el; if (!el) return;
    if (el.ended){ el.currentTime = 0; el.play().catch(() => {}); }
    else if (el.paused) el.play().catch(() => {});
    else el.pause();
    tmDraw();
  }
  function mediaTap(e){
    const r = cv.getBoundingClientRect(), ny = (e.clientY - r.top) * cv.height / r.height;
    SFX.key();
    if (Math.floor((ny - OY) / 10) <= 1) return mediaBack();
    mediaToggle();
  }
  const mmss = t => { t = Math.max(0, Math.floor(isFinite(t) ? t : 0)); return String(t / 60 | 0).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
  function drawMedia(x){
    const M = TM.media, el = M.el;
    const state = M.err ? "NO SIGNAL" : el.ended ? "ENDED" : el.paused ? "PAUSED" : "PLAYING";
    const col = M.err ? PAL.bad : (el.paused || el.ended) ? PAL.amb : PAL.ok;
    put(x, "[BACK]", 0, 0, PAL.hi);
    if (M.a.kind === "A") drawAudio(x, M, state, col); else drawVideo(x, M, state, col);
  }
  function drawAudio(x, M, state, col){
    const a = M.a, el = M.el, dur = isFinite(el.duration) ? el.duration : 0, t = el.currentTime || 0;
    const frac = el.ended ? 1 : dur ? Math.min(1, t / dur) : 0;
    put(x, a.name, 0, 1, PAL.hi);
    let row = 2;
    if (a.caption){ put(x, a.caption.slice(0, TM.cols), 0, row, PAL.text); row++; }
    const top = OY + row * 10 + 2, h = 34, bars = Math.floor(TM.cols * 6 / 4);
    let data = null;
    if (M.an && !el.paused){ data = new Uint8Array(M.an.frequencyBinCount); M.an.getByteFrequencyData(data); }
    for (let i = 0; i < bars; i++){
      const v = data ? data[Math.floor(i / bars * data.length * 0.7)] / 255
                     : el.paused ? 0.05 : 0.15 + 0.6 * Math.abs(Math.sin(i * 0.7 + Date.now() / 160)) * Math.random();
      const bh = Math.max(1, Math.round(v * h));
      x.fillStyle = i / bars <= frac ? PAL.hi : PAL.dim;
      x.fillRect(OX + i * 4, top + Math.round((h - bh) / 2), 3, bh);
    }
    row += 4;
    put(x, mmss(t) + " / " + mmss(dur), 0, row, PAL.text); put(x, state, TM.cols - state.length, row, col); row++;
    const lines = [];
    (a.transcript || []).forEach(([cls, l]) => wrap(l, TM.cols).forEach(cs => lines.push([cls, cs])));
    let show = Math.floor(lines.reduce((n, [, cs]) => n + cs.length, 0) * frac);
    const out = [];
    for (const [cls, cs] of lines){ if (show <= 0) break; out.push([cls, cs.slice(0, show)]); show -= cs.length; }
    const room = Math.max(0, TM.rows - row - 1);
    out.slice(-room || out.length).slice(0, room).forEach(([cls, cs], i) => cs.forEach((c, j) => drawCell(x, c, j, row + i, COLOR(cls))));
    put(x, el.ended ? "TAP TO REPLAY" : el.paused ? "TAP TO PLAY" : "TAP TO PAUSE", 0, TM.rows - 1, PAL.dim);
  }
  // The FMV look: CRT resolution, a dithered 64-color palette, interlace lines, about 10 frames a second.
  const vbuf = document.createElement("canvas"), vctx = vbuf.getContext("2d", { willReadFrequently: true });
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.5) * 40);
  let vTaint = false;
  function drawVideo(x, M, state, col){
    const el = M.el;
    put(x, M.a.name.slice(0, Math.max(0, TM.cols - 18)), 7, 0, PAL.hi);
    put(x, state, TM.cols - state.length, 0, col);
    const top = OY + 22, availW = cv.width - 2 * OX, availH = cv.height - top - 2;
    if (!el.videoWidth){ put(x, M.err ? "NO SIGNAL" : "ACQUIRING FEED...", 0, 3, M.err ? PAL.bad : PAL.dim); return; }
    const sc = Math.min(availW / el.videoWidth, availH / el.videoHeight);
    const w = Math.max(8, Math.floor(el.videoWidth * sc)), h = Math.max(8, Math.floor(el.videoHeight * sc));
    const ox = Math.floor((cv.width - w) / 2);
    if (vbuf.width !== w || vbuf.height !== h){ vbuf.width = w; vbuf.height = h; }
    vctx.drawImage(el, 0, 0, w, h);
    if (!vTaint){
      try{
        const img = vctx.getImageData(0, 0, w, h), d = img.data;
        for (let y = 0; y < h; y++){
          const dim = y & 1 ? 0.55 : 1;
          for (let xx = 0; xx < w; xx++){
            const i = (y * w + xx) * 4, b = BAYER[(y & 3) * 4 + (xx & 3)];
            for (let c = 0; c < 3; c++) d[i + c] = Math.max(0, Math.min(255, Math.round((d[i + c] + b) / 85) * 85)) * dim;
          }
        }
        vctx.putImageData(img, 0, 0);
      }catch(e){ vTaint = true; }   // a local file:// clip can't be read back, so it gets lines only
    }
    x.drawImage(vbuf, ox, top);
    if (vTaint){ x.fillStyle = "rgba(0,0,0,0.45)"; for (let y = top + 1; y < top + h; y += 2) x.fillRect(ox, y, w, 1); }
    const c0 = Math.ceil((ox - OX) / 6) + 1, r1 = Math.ceil((top - OY) / 10) + 1, r2 = Math.floor((top + h - OY) / 10) - 2;
    if (!el.paused && (Date.now() / 600 | 0) % 2) put(x, "REC", c0, r1, PAL.bad);
    const tc = mmss(el.currentTime);
    put(x, tc, Math.floor((ox + w - OX) / 6) - tc.length - 1, r2, "#f2efe6");
  }

  /* the printer: theater for the paper handout the GM slides across the table */
  const paper = $("tmPaper");
  function feedPaper(ms){
    paper.style.transition = "none"; paper.style.height = "0px"; void paper.offsetHeight;
    paper.style.transition = `height ${ms}ms steps(${Math.max(4, Math.round(ms / 190))})`; paper.style.height = "";
    paper.classList.add("out");
  }
  function startPrint(items){
    const per = items.length > 1 ? (motion ? 1600 : 300) : (motion ? 2800 : 400);
    TM.print = { items, per, i: 0, t0: Date.now(), done: false };
    TM.mode = "print"; $("tmPLight").classList.add("on");
    feedPaper(per); SFX.print(per); tmDraw();
  }
  function printFinish(){
    const P = TM.print; P.done = true; P.i = P.items.length;
    paper.style.transition = "none"; paper.style.height = ""; paper.classList.add("out");
    $("tmPLight").classList.remove("on"); tmDraw();
  }
  function printTap(){
    const P = TM.print; if (!P) return;
    if (!P.done) return printFinish();
    TM.print = null; TM.mode = "reveal"; tmDraw();
  }
  $("tmPrinter").addEventListener("click", () => { if (TM.mode === "print") printTap(); });
  function drawPrint(x){
    const P = TM.print;
    if (!P.done){
      const k = Math.floor((Date.now() - P.t0) / P.per);
      if (k >= P.items.length) printFinish();
      else if (k > P.i){ P.i = k; feedPaper(P.per); SFX.print(P.per); }
    }
    const rows = [];
    P.items.forEach((it, n) => {
      if (n < P.i) rows.push(["", `PRINTING ${it.name}... OK`]);
      else if (n === P.i && !P.done) rows.push(["", `PRINTING ${it.name}...`]);
    });
    if (P.done){ rows.push(["", ""]); rows.push(["ok", "PRINT COMPLETE."]); rows.push(["amb", "COLLECT OUTPUT."]); rows.push(["", ""]); rows.push(["hi", "TAP OR RETURN TO CONTINUE"]); }
    else { rows.push(["", ""]); rows.push(["dim", "TAP TO SKIP"]); }
    const out = []; rows.forEach(([cls, t]) => wrap(t, TM.cols).forEach(cs => out.push([cls, cs])));
    out.slice(-TM.rows).forEach(([cls, cs], r) => cs.forEach((c, i) => drawCell(x, c, i, r, cls === "dim" ? PAL.dim : COLOR(cls))));
  }
  function drawReveal(x){
    const R = TM.reveal, f = R.done ? 1 : Math.min(1, (Date.now() - R.t0) / R.dur), front = R.done ? Infinity : f * R.chars;
    let n = 0, frontRow = 0;
    R.rows.forEach((r, ri) => {
      r.cs.forEach((c, i) => {
        const real = n < front; n++;
        if (!real && c.c !== " ") r.scr = r.scr || [];
        const vr = ri - R.scroll;
        if (vr < 0 || vr >= TM.rows) return;
        if (real || c.c === " ") drawCell(x, c, i, vr, COLOR(r.cls));
        else drawCell(x, { c: SCRAMBLE[Math.random() * SCRAMBLE.length | 0], g:false }, i, vr, PAL.dim);
      });
      if (n <= front) frontRow = ri;
    });
    if (!R.done){
      R.scroll = Math.max(0, frontRow - TM.rows + 3);
      if (f >= 1) finishReveal();
    }
    const im = R.img;
    if (R.imgRows && R.done && im && im.complete && im.naturalWidth){
      const top = OY + (R.imgAt - R.scroll) * 10, maxW = TM.cols * 6, maxH = R.imgRows * 10;
      const sc = Math.min(maxW / im.naturalWidth, maxH / im.naturalHeight), w = im.naturalWidth * sc, h = im.naturalHeight * sc;
      x.imageSmoothingEnabled = true; x.drawImage(im, OX, top, w, h);
    }
    const total = R.rows.length;
    if (total > TM.rows){
      const H = cv.height - 6, bh = Math.max(8, H * TM.rows / total), by = 3 + (H - bh) * R.scroll / Math.max(1, total - TM.rows + 1);
      x.fillStyle = PAL.dim; x.fillRect(cv.width - 3, 3, 2, H); x.fillStyle = PAL.text; x.fillRect(cv.width - 3, by, 2, bh);
    }
  }

  function tmDraw(){
    if (!TM.open) return;
    const x = cv.getContext("2d"); x.imageSmoothingEnabled = false;
    x.fillStyle = PAL.bg; x.fillRect(0, 0, cv.width, cv.height);
    if (!TM.connected) return;
    if (TM.mode === "route") drawRoute(x);
    else if (TM.mode === "count") drawCount(x);
    else if (TM.mode === "reveal") drawReveal(x);
    else if (TM.mode === "print") drawPrint(x);
    else if (TM.mode === "media") drawMedia(x);
    else drawPrompt(x);
  }

  /* the cable */
  function setConnected(on){
    TM.connected = on;
    plug.classList.toggle("in", on);
    $("tmHint").hidden = on; $("tmLed").classList.toggle("on", on); $("tmPower").classList.toggle("on", on);
    $("tmKeys").classList.toggle("dead", !on); $("tmFkeys").classList.toggle("dead", !on);
  }
  function unplug(){
    stopMedia(); setConnected(false); TM.mode = "off"; TM.lines = []; TM.input = ""; TM.loaded = null; TM.busy = false;
    TM.route = null; TM.reveal = null; TM.print = null; TM.stack = []; glass.className = "tm-glass off"; $("tmDrive").classList.remove("on");
    paper.classList.remove("out"); $("tmPLight").classList.remove("on");
  }
  function plugIn(){
    setConnected(true); TM.drag = null; placeWire(); SFX.thunk();
    glass.className = "tm-glass warm";
    const pad = n => " ".repeat(Math.max(0, Math.floor((TM.cols - n) / 2)));
    const banner = "ANDIS UN.#30 COMMAND PROMPT";
    TM.lines = []; TM.mode = "boot"; tmDraw();
    setTimeout(() => {
      if (!TM.connected) return;
      glass.className = "tm-glass degauss"; SFX.hum();
      say(pad(banner.length) + banner); say(pad(16) + "3583 BYTES FREE"); say(""); say("READY.");
      TM.mode = "prompt"; tmDraw();
      setTimeout(() => { if (glass.classList.contains("degauss")) glass.className = "tm-glass"; }, 450);
    }, motion ? 800 : 50);
  }
  function stagePt(e){ const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / TM.k, y: (e.clientY - r.top) / TM.k }; }
  plug.addEventListener("pointerdown", e => {
    if (TM.connected) return;
    e.preventDefault(); plug.setPointerCapture(e.pointerId);
    const p = stagePt(e); TM.drag = { dx: TM.plug.x - p.x, dy: TM.plug.y - p.y }; plug.classList.add("drag");
  });
  plug.addEventListener("pointermove", e => {
    if (!TM.drag) return;
    const p = stagePt(e); TM.plug = { x: p.x + TM.drag.dx, y: p.y + TM.drag.dy };
    const P = anchors().P;
    if (Math.hypot(TM.plug.x - P.x, TM.plug.y + 17 - P.y) < 48){ plug.classList.remove("drag"); plugIn(); return; }
    placeWire();
  });
  function dropPlug(){
    if (!TM.drag) return;
    plug.classList.remove("drag");
    const from = { ...TM.plug }, to = anchors().rest, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / 260), e = 1 - Math.pow(1 - k, 3);
      TM.plug = { x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e }; placeWire();
      if (k < 1 && TM.drag) requestAnimationFrame(step); else TM.drag = null;
    };
    requestAnimationFrame(step);
  }
  plug.addEventListener("pointerup", dropPlug); plug.addEventListener("pointercancel", dropPlug);

  /* open, close, the top bar button */
  function openTerm(){
    unlockAudio(); TM.open = true; $("tm").hidden = false;
    const resume = TM.connected && ["route", "count", "reveal"].includes(TM.mode);
    if (!resume) unplug();
    TM.drag = null; tmLayout();
  }
  function closeTerm(){ if (TM.mode === "media") mediaBack(); TM.open = false; $("tm").hidden = true; TM.drag = null; endDrag(); }
  $("tmClose").addEventListener("click", closeTerm);
  $("bTerm").addEventListener("click", openTerm);
  function ringUpdate(){
    let frac = 0, done = false;
    const list = TM.loaded ? [TM.loaded, ...SIGNALS] : SIGNALS;
    for (const s of list){
      const v = sigNow(s);
      if (v.s === "running" || v.s === "paused"){ frac = Math.min(1, Math.max(0, 1 - leftMs(v) / (v.total || s.time * 1000))); break; }
      if (v.s === "decoded" && !v.seen) done = true;
    }
    $("bTermRing").style.strokeDashoffset = String(44 * (1 - (done ? 1 : frac)));
    $("bTerm").classList.toggle("done", done);
  }

  /* GM panel: Skip, Pause, Add time, Reset signal */
  function termGM(){
    $("gmSigBlock").hidden = !SIGNALS.length;
    if (!SIGNALS.length) return;
    const box = $("gmSigs"); box.replaceChildren();
    SIGNALS.forEach((s, i) => {
      const b = el("button", "gm-btn", s.program); b.type = "button"; b.setAttribute("aria-pressed", String(i === TM.gmSel));
      b.addEventListener("click", () => { TM.gmSel = i; termGM(); }); box.append(b);
    });
    termGMStatus();
  }
  function termGMStatus(){
    if (!SIGNALS.length) return;
    const s = SIGNALS[TM.gmSel], v = sigNow(s);
    const what = { fresh: "not started", running: "decrypting, " + clock(leftMs(v)) + " left",
                   paused: "on hold, " + clock(leftMs(v)) + " left", decoded: v.seen ? "decoded" : "decoded, not viewed yet" }[v.s];
    $("gmSigStatus").textContent = `${s.id} (LOAD "${s.program}"): ${what}`;
    $("gmSigPause").textContent = v.s === "paused" ? "Resume" : "Pause";
    $("gmSigPause").disabled = !(v.s === "running" || v.s === "paused");
    $("gmSigAdd").disabled = !(v.s === "running" || v.s === "paused");
    $("gmSigSkip").disabled = v.s === "decoded";
  }
  function gmSig(fn){ const s = SIGNALS[TM.gmSel]; if (!s) return; fn(s, sigNow(s)); termGMStatus(); ringUpdate(); tmDraw(); }
  $("gmSigSkip").addEventListener("click", () => gmSig(s => sset(s.id, { s:"decoded", seen:false, src: OUT })));
  $("gmSigPause").addEventListener("click", () => gmSig((s, v) => {
    if (v.s === "running") sset(s.id, { s:"paused", left: leftMs(v), total: v.total, src: v.src });
    else if (v.s === "paused") sset(s.id, { s:"running", end: Date.now() + v.left, total: v.total, src: v.src });
  }));
  $("gmSigAdd").addEventListener("click", () => gmSig((s, v) => {
    if (v.s === "running") sset(s.id, { ...v, end: v.end + 600000, total: v.total + 600000 });
    else if (v.s === "paused") sset(s.id, { ...v, left: v.left + 600000, total: v.total + 600000 });
  }));
  $("gmSigReset").addEventListener("click", () => gmSig(s => {
    sset(s.id, null);
    if (TM.loaded === s && ["route", "count", "reveal", "print", "media"].includes(TM.mode)){ stopMedia(); TM.stack = []; TM.print = null; TM.mode = "prompt"; TM.route = null; TM.reveal = null; say("READY."); }
  }));
  if (/[?&]omnitest\b/.test(location.search)) window.__omniTerm = TM;
  if (SIGNALS.length){
    $("bTerm").hidden = false;
    let blink = -1;
    setInterval(() => {
      ringUpdate();
      if (!$("gm").hidden) termGMStatus();
      if (!TM.open || !TM.connected) return;
      if (TM.mode === "prompt"){ const b = (Date.now() / 420 | 0) % 2; if (b !== blink){ blink = b; tmDraw(); } }
      else if (["count", "reveal", "print", "media"].includes(TM.mode)) tmDraw();
    }, 100);
  }

  /* ---------- Boot ---------- */
  $("bootCrest").append($("crestTpl").content.cloneNode(true));
  $("bootNet").textContent = SKINS.normal.network;
  $("bootMotto").textContent = CAMP.motto || "";
  $("bootMotto").hidden = !CAMP.motto;
  if (startAlert){
    // Start: alert opens straight into emergency mode with a terminal boot instead of the crest.
    $("boot").classList.add("alert-boot");
    $("bootCrest").hidden = true; $("bootMotto").hidden = true;
    $("bootNet").textContent = SKINS.alert.network;
    const bl = $("bootLines"); bl.hidden = !(SKINS.alert.bootLines || []).length;
    (SKINS.alert.bootLines || []).forEach(([cls, text]) => bl.append(el("div", cls || null, "> " + text)));
  }
  function connect(){
    unlockAudio(); wake();
    try{ if (!document.fullscreenElement && root.requestFullscreen) root.requestFullscreen({navigationUI:"hide"}).catch(() => {}); }catch(e){}
    $("boot").hidden = true; glitch($("dossier"));
    if (globe && globe.redraw) requestAnimationFrame(() => globe.redraw());
  }
  $("boot").addEventListener("click", connect);
  $("boot").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); connect(); } });

  // World switcher (only when the session carries more than one world)
  if (DATA.worlds.length > 1){
    const nav = $("worlds"); nav.hidden = false;
    if (DATA.worlds.length > 6){
      // Big atlas: the Deep Scan catalog is the world picker.
      const b = el("button", "tb", "World catalog (" + DATA.worlds.length + ")"); b.type = "button";
      b.addEventListener("click", () => showView("deep")); nav.append(b);
    } else {
      DATA.worlds.forEach((w, i) => {
        const b = el("button", "tb", w.name); b.type = "button"; b.dataset.i = i;
        b.addEventListener("click", () => { render(i); syncPicks(); });
        nav.append(b);
      });
      nav.firstChild.setAttribute("aria-pressed", "true");
    }
  }
  buildDeepShell();
  store.get().forEach(id => { if (TRIG(id)) fired.add(id); });
  alertOn = computeAlert();
  render(0); renderBriefs();
  if (fired.size){ $("tabBriefs").classList.add("flash"); $("boot").hidden = true; }
  const first = DATA.worlds[0];
  showView(first.images && (first.images.map || first.images.planet) ? "scan" : "deep");
})();
</script>
</body>
</html>
